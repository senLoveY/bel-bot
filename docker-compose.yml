services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bel
      POSTGRES_PASSWORD: bel
      POSTGRES_DB: bel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bel"]
      interval: 5s
      retries: 10

  api:
    build: .
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bel:bel@db:5432/bel
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: .
    command: python -m app.bot
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bel:bel@db:5432/bel
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
