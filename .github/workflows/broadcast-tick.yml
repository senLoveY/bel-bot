# Ручной запуск рассылки: Actions → Broadcast tick → Run workflow.
# Регулярный запуск лучше настроить во внешнем кроне (например, cron-job.org) раз в 5 минут:
# в приватном репозитории частый schedule в GitHub Actions быстро съедает бесплатные минуты.
# Нужны: секрет CRON_SECRET и переменная APP_URL (Settings → Secrets and variables → Actions).

name: Broadcast tick
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "*/10 * * * *"

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily cards
        run: |
          curl -fsS -X POST "${{ vars.APP_URL }}/api/cron/tick" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 60
