# Миграции базы. Адрес базы берётся из DATABASE_URL (настройки приложения), а не из этого файла.
#   alembic upgrade head                      — применить миграции
#   alembic revision --autogenerate -m "..."  — новая миграция по изменениям в app/models.py
# Приложение применяет миграции само при старте (app.migrations.upgrade_database).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
