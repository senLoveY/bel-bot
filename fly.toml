# fly.toml app configuration file generated for zyarnyatka-bel
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'zyarnyatka-bel'
primary_region = 'ams'

[build]

# api — Mini App и API, засыпает без трафика (дёшево).
# bot — бот и планировщик рассылки, работает всегда, ровно один экземпляр (иначе polling дублируется).
[processes]
  api = 'uvicorn app.api:app --host 0.0.0.0 --port 8080'
  bot = 'python -m app.bot'

[http_service]
  processes = ['api']
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
